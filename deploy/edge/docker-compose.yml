services:
  digi-dx-edge:
    image: ${DIGI_DX_EDGE_IMAGE:-ghcr.io/mpmbq2/digi-dx-edge:latest}
    container_name: digi-dx-edge
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/snd:/dev/snd
      # Uncomment if running rigctld inside the container instead of on the host:
      # - /dev/ttyUSB2:/dev/ttyUSB2
    group_add:
      - audio
      - dialout
    volumes:
      - ../../data:/var/lib/digi-dx
    environment:
      - DIGI_DX_CONFIG_PATH=/var/lib/digi-dx/config.json
      - DIGI_DX_CLOUD_URL=${DIGI_DX_CLOUD_URL:-ws://127.0.0.1:8795}
      - DIGI_DX_STATION_ID=${DIGI_DX_STATION_ID:-}
