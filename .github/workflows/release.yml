name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g., v2.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-ui:
    name: Build Frontend UI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI bundle
        run: make ui-deps && make ui-check && make ui-build

      - name: Upload UI dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: build-ui
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:bookworm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev curl ca-certificates tar gzip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download UI dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - name: Build release binary
        run: cargo build --release

      - name: Package release archive
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/stage
          cp target/release/digi-dx dist/stage/digi-dx
          chmod 0755 dist/stage/digi-dx
          cp README.md dist/stage/
          cp -r deploy dist/stage/
          tar -czf "dist/digi-dx-linux-${ARCH}.tar.gz" -C dist/stage .

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/digi-dx-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS (Apple Silicon)
    needs: build-ui
    runs-on: macos-15
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download UI dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - name: Build release binary
        run: cargo build --release

      - name: Verify Apple Silicon binary signature
        run: |
          file target/release/digi-dx
          codesign --verify --verbose target/release/digi-dx

      - name: Package release archive
        run: |
          mkdir -p dist/stage
          cp target/release/digi-dx dist/stage/digi-dx
          chmod 0755 dist/stage/digi-dx
          cp README.md dist/stage/
          cp -r deploy dist/stage/
          tar -czf "dist/digi-dx-darwin-aarch64.tar.gz" -C dist/stage .

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin-aarch64
          path: dist/digi-dx-darwin-aarch64.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      darwin_arm64_sha256: ${{ steps.checksums.outputs.darwin_arm64_sha256 }}

    steps:
      - name: Determine release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all release archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        id: checksums
        run: |
          cd release-assets
          sha256sum digi-dx-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          DARWIN_SHA="$(awk '/digi-dx-darwin-aarch64\.tar\.gz$/ {print $1}' SHA256SUMS)"
          echo "darwin_arm64_sha256=${DARWIN_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/digi-dx-*.tar.gz release-assets/SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              release-assets/digi-dx-*.tar.gz \
              release-assets/SHA256SUMS \
              --title "Digi-Dx ${TAG}" \
              --generate-notes
          fi

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: publish-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Update mpmbq2/homebrew-tap Formula/digi-dx.rb
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.publish-release.outputs.tag }}
          VERSION: ${{ needs.publish-release.outputs.version }}
          DARWIN_SHA: ${{ needs.publish-release.outputs.darwin_arm64_sha256 }}
        run: |
          TARBALL_URL="https://github.com/mpmbq2/digi-dx/releases/download/${TAG}/digi-dx-darwin-aarch64.tar.gz"
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN secret not set; skipping automatic Homebrew tap update." >> "$GITHUB_STEP_SUMMARY"
            echo "Update Formula/digi-dx.rb in mpmbq2/homebrew-tap with:" >> "$GITHUB_STEP_SUMMARY"
            echo "- version: \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- url: \`${TARBALL_URL}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- sha256: \`${DARWIN_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/mpmbq2/homebrew-tap.git" tap
          cd tap
          mkdir -p Formula
          cat > Formula/digi-dx.rb <<EOF
          class DigiDx < Formula
            desc "Local-first FT8 & transceiver daemon with embedded web console"
            homepage "https://github.com/mpmbq2/digi-dx"
            url "${TARBALL_URL}"
            version "${VERSION}"
            sha256 "${DARWIN_SHA}"
            license "MIT"

            depends_on :macos
            depends_on arch: :arm64
            depends_on "hamlib"

            def install
              bin.install "digi-dx"
            end

            service do
              run [opt_bin/"digi-dx", "serve"]
              keep_alive crashed: true
              log_path var/"log/digi-dx.log"
              error_log_path var/"log/digi-dx.log"
              environment_variables(
                DIGI_DX_BIND: "0.0.0.0",
                DIGI_DX_PORT: "8788",
                PATH:         std_service_path_env,
                RUST_LOG:     "info",
              )
            end

            def caveats
              <<~EOS
                Start Digi-Dx in the background (and automatically on login):
                  brew services start digi-dx

                Then open the web console in your browser:
                  http://127.0.0.1:8788

                Default weak-signal FT8/FT4 decoder: install ftxr-modem
                (otherwise Digi-Dx falls back to jt9 or its built-in ft8_lib decoder):
                  https://github.com/mpmbq2/ftxr-modem/releases

                Note: on first run, macOS may ask for Microphone permission so
                Digi-Dx can read RX audio from your radio's USB soundcard.
                If RX audio appears silent, run:
                  digi-dx preflight --probe-audio
                and allow access in System Settings -> Privacy & Security -> Microphone.
              EOS
            end

            test do
              assert_match "digi-dx", shell_output("#{bin}/digi-dx --help")
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/digi-dx.rb
          if ! git diff --cached --quiet; then
            git commit -m "digi-dx ${TAG}"
            git push origin main
          fi
