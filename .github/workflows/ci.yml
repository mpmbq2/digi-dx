name: CI

on:
  push:
    branches:
      - main
      - mvp-rebuild
      - "feat/*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FTXR_REPO: mpmbq2/ftxr-modem
  FTXR_VERSION: v0.1.0
  FTXR_SHA256_LINUX_X86_64: d811a697c82543d4e76999bc7315e051807b132f7c7e2f441b979879ce96d562
  FTXR_SHA256_DARWIN_AARCH64: c11993daab5024260140992d917417975b5199db4ffcb5ee84f097c1810c9c4e

jobs:
  test-and-lint:
    name: Linux x86_64 Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libhamlib-utils shellcheck

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install, typecheck, and build UI
        run: make ui-deps && make ui-check && make ui-build

      - name: Run Rust and script linters
        run: make lint

      - name: Verify installer dry-runs
        run: |
          ./scripts/install.sh --dry-run
          ./scripts/install.sh --dry-run --from-source --no-ftxr

      - name: Stage verified FT8/FT4 decoder sidecar for tests
        run: |
          mkdir -p ftxr-stage target/debug/libexec
          TARBALL="ftxr-modem-${FTXR_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL "https://github.com/${FTXR_REPO}/releases/download/${FTXR_VERSION}/${TARBALL}" -o "ftxr-stage/${TARBALL}"
          echo "${FTXR_SHA256_LINUX_X86_64}  ftxr-stage/${TARBALL}" | sha256sum -c -
          tar -xzf "ftxr-stage/${TARBALL}" -C ftxr-stage
          chmod 0755 ftxr-stage/ftxr-modem
          cp ftxr-stage/ftxr-modem target/debug/libexec/ftxr-modem
          echo "DIGI_DX_FTXR_PATH=$PWD/target/debug/libexec/ftxr-modem" >> "$GITHUB_ENV"

      - name: Run Rust unit and integration tests
        run: cargo test

      - name: Build debug daemon binary for browser smoke test
        run: cargo build

      - name: Ensure headless Chromium is available
        run: |
          if [[ ! -x /usr/bin/google-chrome && ! -x /usr/bin/chromium && ! -x /usr/bin/chromium-browser ]]; then
            cd ui && npx playwright-core install chromium --with-deps
          fi

      - name: Run Playwright browser smoke test
        run: DIGI_DX_BIN="$PWD/target/debug/digi-dx" npm --prefix ui run test:browser

  macos-arm64:
    name: macOS Apple Silicon Build & Test
    runs-on: macos-15
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Hamlib via Homebrew
        run: brew install hamlib

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install, typecheck, and build UI
        run: make ui-deps && make ui-check && make ui-build

      - name: Run Rust clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Verify installer dry-runs on macOS
        run: |
          ./scripts/install.sh --dry-run
          ./scripts/install.sh --dry-run --no-ftxr

      - name: Stage verified FT8/FT4 decoder sidecar for tests
        run: |
          mkdir -p ftxr-stage target/debug/libexec target/release/libexec
          TARBALL="ftxr-modem-${FTXR_VERSION}-darwin-aarch64.tar.gz"
          curl -fsSL "https://github.com/${FTXR_REPO}/releases/download/${FTXR_VERSION}/${TARBALL}" -o "ftxr-stage/${TARBALL}"
          echo "${FTXR_SHA256_DARWIN_AARCH64}  ftxr-stage/${TARBALL}" | shasum -a 256 -c -
          tar -xzf "ftxr-stage/${TARBALL}" -C ftxr-stage
          chmod 0755 ftxr-stage/ftxr-modem
          cp ftxr-stage/ftxr-modem target/debug/libexec/ftxr-modem
          cp ftxr-stage/ftxr-modem target/release/libexec/ftxr-modem
          echo "DIGI_DX_FTXR_PATH=$PWD/target/release/libexec/ftxr-modem" >> "$GITHUB_ENV"

      - name: Run Rust unit and integration tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

